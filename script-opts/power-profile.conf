# Auto switch profile berdasarkan status charger Linux.
# enabled=yes/no
enabled=yes

# Saat charger dicabut.
battery_profile=battery

# Saat charger tersambung atau baterai sudah full.
charging_profile=full-performance

# Deteksi ulang status charger setiap N detik.
poll_interval=10

# Tampilkan OSD pendek saat mode berubah.
show_osd=yes
